{% extends "learning_logs/base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-10 col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
                <h2 class="h4 fw-bold text-primary mb-0">编辑条目</h2>
                <a href="{% url 'learning_logs:topic' topic.id %}" class="btn btn-outline-secondary btn-sm">
                    &larr; 返回 {{ topic }}
                </a >
            </div>
            <div class="card-body p-4">
                <form action="{% url 'learning_logs:edit_entry' entry.id %}" method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="{{ form.text.id_for_label }}" class="form-label fw-bold">{{ form.text.label }}</label>
                        {{ form.text }}
                    </div>

                    <div class="d-grid gap-2">
                        <button name="submit" class="btn btn-primary btn-lg">保存修改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
