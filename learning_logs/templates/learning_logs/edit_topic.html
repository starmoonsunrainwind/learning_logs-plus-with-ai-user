{% extends "learning_logs/base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h2 class="text-center fw-bold text-primary">编辑主题</h2>
            </div>
            <div class="card-body p-4">
                <form action="{% url 'learning_logs:edit_topic' topic.id %}" method="post">
                    {% csrf_token %}
                    
                    {% if form.text.errors %}
                        <div class="alert alert-danger py-2 small">{{ form.text.errors }}</div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="{{ form.text.id_for_label }}" class="form-label fw-bold">{{ form.text.label }}</label>
                        {{ form.text }}
                    </div>

                    <div class="mb-4 p-3 bg-light rounded border">
                        <div class="form-check">
                            {{ form.public }}
                            <label class="form-check-label fw-bold" for="{{ form.public.id_for_label }}">
                                {{ form.public.label }}
                            </label>
                        </div>
                        <div class="small text-muted mt-1 ms-4">
                            勾选后，该主题将对其他用户可见。
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button name="submit" class="btn btn-primary btn-lg">保存修改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
