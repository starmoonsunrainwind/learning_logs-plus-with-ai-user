{% extends 'learning_logs/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            
            <!-- 卡片容器 -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4 fw-bold text-primary">用户登录</h2>
                    
                    <!-- 错误提示处理 -->
                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            账号或密码错误，请重试。
                        </div>
                    {% endif %}

                    <form action="{% url 'accounts:login' %}" method='post'>
                        {% csrf_token %}
                        
                        <!-- 渲染表单字段 (Django默认渲染) -->
                        <!-- 如果想更精细控制，可以手动写 input，但 as_div 在 BS5 下通常表现尚可 -->
                        {{ form.as_div }}
                        
                        <!-- 提交按钮 -->
                        <div class="d-grid gap-2 mt-3">
                            <button name="submit" class="btn btn-primary btn-lg">登录</button>
                        </div>
                    </form>
                </div>
                
                <!-- 底部链接区 -->
                <div class="card-footer text-center bg-white border-0 pb-3">
                    <p class="text-muted small mb-0">还没有账号？ <a href="{% url 'accounts:register' %}" class="text-decoration-none">立即注册</a ></p >
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock content %}
